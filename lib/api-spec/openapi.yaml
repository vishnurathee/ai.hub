openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: |
    Private AI Hub API. Except for health checks, a valid Clerk session is
    required. Conversations and comparisons are visible only to their owner.
    Legacy unowned history is retained but is not available to customer accounts.
    AI requests allow 8000 prompt characters and at most six distinct providers.
    Each provider attempt costs one unit, including failed provider attempts:
    eight units per minute and forty per hour per account, and two hundred per
    hour across the workspace. Exhausted limits return 429 with Retry-After.
    API writes also allow thirty attempts per minute and three hundred per hour
    per account, and three thousand per hour across the workspace.
security:
  - clerkSession: []
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: aiHub
    description: Shared AI Hub providers, conversations, and comparisons
paths:
  /healthz:
    get:
      security: []
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /providers:
    get:
      operationId: listProviders
      tags: [aiHub]
      summary: List configured AI providers
      responses:
        "200":
          description: Providers and their runtime configuration
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AiProvider" }
  /conversations:
    get:
      operationId: listConversations
      tags: [aiHub]
      summary: List conversations
      parameters:
        - in: query
          name: providerId
          schema: { type: string }
      responses:
        "200":
          description: Conversations ordered by most recently updated
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Conversation" }
    post:
      operationId: createConversation
      tags: [aiHub]
      summary: Start a provider conversation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConversationInput" }
      responses:
        "200":
          description: New conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
  /conversations/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    patch:
      operationId: updateConversation
      tags: [aiHub]
      summary: Rename or pin a conversation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConversationUpdate" }
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
    delete:
      operationId: deleteConversation
      tags: [aiHub]
      summary: Delete conversation and its messages
      responses:
        "204":
          description: Deleted
  /conversations/{id}/messages:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      operationId: listMessages
      tags: [aiHub]
      summary: Get a conversation's messages
      responses:
        "200":
          description: Messages ordered by timestamp
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChatMessage" }
    post:
      operationId: sendMessage
      tags: [aiHub]
      summary: Send a message or retry a failed one
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageInput" }
      responses:
        "200":
          description: Persisted user and assistant messages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResult" }
  /compare:
    post:
      operationId: createComparison
      tags: [aiHub]
      summary: Compare live responses across providers
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComparisonInput" }
      responses:
        "200":
          description: Persisted comparison; individual providers may return errors
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comparison" }
  /comparisons:
    get:
      operationId: listComparisons
      tags: [aiHub]
      summary: List previous comparisons
      responses:
        "200":
          description: Comparisons newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Comparison" }
components:
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AiProvider:
      type: object
      required: [id, name, displayName, icon, color, description, isActive, apiKeySet, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        displayName: { type: string }
        icon: { type: string }
        color: { type: string }
        description: { type: string }
        isActive: { type: ["boolean", "null"] }
        apiKeySet: { type: ["boolean", "null"] }
        createdAt: { type: ["string", "null"] }
    Conversation:
      type: object
      required: [id, providerId, title, isPinned, createdAt, updatedAt]
      properties:
        id: { type: string }
        providerId: { type: ["string", "null"] }
        title: { type: string }
        isPinned: { type: ["boolean", "null"] }
        createdAt: { type: ["string", "null"] }
        updatedAt: { type: ["string", "null"] }
    ConversationInput:
      type: object
      required: [providerId, title]
      properties:
        providerId: { type: string }
        title: { type: string, minLength: 1, maxLength: 120 }
    ConversationUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        isPinned: { type: boolean }
    ChatMessage:
      type: object
      required: [id, conversationId, role, content, timestamp, responseTime]
      properties:
        id: { type: string }
        conversationId: { type: ["string", "null"] }
        role: { type: string }
        content: { type: string }
        timestamp: { type: ["string", "null"] }
        responseTime: { type: ["string", "null"] }
    MessageInput:
      type: object
      additionalProperties: false
      description: Supply content to send a new message, or retryMessageId to retry a failed message.
      properties:
        content: { type: string, minLength: 1, maxLength: 8000 }
        retryMessageId: { type: string, minLength: 1, maxLength: 100 }
    MessageResult:
      type: object
      required: [userMessage, assistantMessage]
      properties:
        userMessage: { $ref: "#/components/schemas/ChatMessage" }
        assistantMessage: { $ref: "#/components/schemas/ChatMessage" }
    ComparisonInput:
      type: object
      additionalProperties: false
      required: [prompt, providerIds]
      properties:
        prompt: { type: string, minLength: 1, maxLength: 8000 }
        providerIds:
          type: array
          minItems: 1
          maxItems: 6
          uniqueItems: true
          items: { type: string }
    ProviderResponse:
      type: object
      required: [providerId, providerName, providerIcon, providerColor]
      properties:
        providerId: { type: string }
        providerName: { type: string }
        providerIcon: { type: string }
        providerColor: { type: string }
        response: { type: string }
        responseTime: { type: string }
        error: { type: string }
    Comparison:
      type: object
      required: [id, prompt, responses, createdAt]
      properties:
        id: { type: string }
        prompt: { type: string }
        responses:
          type: array
          items: { $ref: "#/components/schemas/ProviderResponse" }
        createdAt: { type: ["string", "null"] }

